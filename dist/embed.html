<script type="text/plain" id="worklet-src">
class DeepNoise extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    const { bytes, params } = opts.processorOptions;
    const mod = new WebAssembly.Module(bytes);
    this.e = new WebAssembly.Instance(mod, { m: { tan: Math.tan, sin: Math.sin, cos: Math.cos } }).exports;
    this.e.init(sampleRate);
    for (const [k, v] of params) this.e.setParam(k, v);
    this.e.snap();
    this.L = new Float32Array(this.e.memory.buffer, 0, 128);
    this.R = new Float32Array(this.e.memory.buffer, 512, 128);
    this.port.onmessage = (ev) => { for (const [k, v] of ev.data) this.e.setParam(k, v); };
  }
  process(_in, outs) {
    const o = outs[0], n = o[0].length;
    for (let off = 0; off < n; off += 128) {
      const m = Math.min(128, n - off);
      this.e.process(m);
      o[0].set(this.L.subarray(0, m), off);
      if (o[1]) o[1].set(this.R.subarray(0, m), off);
    }
    return true;
  }
}
registerProcessor('deep-noise', DeepNoise);
</script>

// ── 파라미터 정의 ────────────────────────────────────────────
// id: 엔진 파라미터 번호, map: UI값 → 엔진값
const logMap = (lo, hi) => v => lo * Math.pow(hi / lo, v);
const CONTROLS = [
  { key:'white', g:'mix', label:'White', id:1, color:'#e8ecff', fmt:pct },
  { key:'pink',  g:'mix', label:'Pink',  id:2, color:'#ff9ccf', fmt:pct },
  { key:'brown', g:'mix', label:'Brown', id:3, color:'#d39a6a', fmt:pct },
  { key:'deep',  g:'mix', label:'Deep 서브베이스', id:4, color:'#4f6bff', fmt:pct },
  { key:'rain',  g:'mix', label:'빗방울', id:12, color:'#6fd3e8', fmt:pct },

  { key:'subf',  g:'tone', label:'서브 주파수', id:5, color:'#4f6bff', map:logMap(25,120), fmt:v=>Math.round(logMap(25,120)(v))+' Hz' },
  { key:'bass',  g:'tone', label:'베이스 부스트', id:6, color:'#7a8cff', map:v=>v*4, fmt:v=>'+'+(20*Math.log10(1+v*4)).toFixed(1)+' dB' },
  { key:'tone',  g:'tone', label:'톤 (로우패스)', id:7, color:'#b48cff', map:logMap(120,20000), fmt:v=>{const f=logMap(120,20000)(v);return f>=1000?(f/1000).toFixed(1)+' kHz':Math.round(f)+' Hz'} },
  { key:'air',   g:'tone', label:'Air (고역 광채)', id:8, color:'#c9b8ff', min:-1, map:v=>v>0?v*1.5:v*0.95, fmt:v=>(v>0?'+':'')+Math.round(v*100) },
  { key:'warm',  g:'tone', label:'웜스 (새츄레이션)', id:14, color:'#ffb38a', fmt:pct },

  { key:'width', g:'move', label:'스테레오 폭', id:9, color:'#7aa2ff', fmt:pct },
  { key:'swell', g:'move', label:'스웰 깊이 (파도)', id:10, color:'#6fd3e8', fmt:pct },

function pct(v){ return Math.round(v*100)+'%'; }

const BASE = { white:0, pink:0, brown:0, deep:0, rain:0, subf:.4, bass:0, tone:1, air:0, warm:0, width:.6, swell:0, rate:.4, dens:.5 };

// ── 상태 ───────────────────────────────────────────────────
const LS = 'deepnoise.v1';
let state = { preset:'깊은 우주', vol:.6, v:{ ...BASE, ...PRESETS[0].v } };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.v) state = { ...state, ...s, v:{ ...BASE, ...s.v } }; } catch {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} };

const $ = id => document.getElementById(id);
let ctx, node, out, analyser, playing = false, raf = 0;

const masterOf = v => 1.5 * v * v;
function engineParams() {
  const p = [[0, masterOf(state.vol)]];
  for (const c of CONTROLS) p.push([c.id, (c.map || (x=>x))(state.v[c.key])]);
  return p;
}
function send(pairs) { if (node) node.port.postMessage(pairs); }

// ── UI 빌드 ────────────────────────────────────────────────
const inputs = {};
function paint(inp) {
  const min = +inp.min, max = +inp.max;
  inp.style.setProperty('--p', ((inp.value - min) / (max - min) * 100) + '%');
}
for (const c of CONTROLS) {
  const wrap = document.createElement('div'); wrap.className = 'ctl';
  const min = c.min ?? 0;
  wrap.innerHTML = `<label><span><i class="dot" style="background:${c.color}"></i>${c.label}</span><output></output></label>
    <input type="range" min="${min}" max="1" step="0.001" aria-label="${c.label}">`;
  const inp = wrap.querySelector('input'), o = wrap.querySelector('output');
  inp.style.setProperty('--c', c.color);
  inp.value = state.v[c.key];
  const upd = () => { o.textContent = c.fmt(+inp.value); paint(inp); };
  inp.addEventListener('input', () => {
    state.v[c.key] = +inp.value; upd();
    send([[c.id, (c.map || (x=>x))(+inp.value)]]);
    if (state.preset) { state.preset = null; renderPreset(); }
    save();
  });
  inp.addEventListener('dblclick', () => { inp.value = BASE[c.key]; inp.dispatchEvent(new Event('input')); });
  upd(); inputs[c.key] = { inp, upd };
  $('g-' + c.g).appendChild(wrap);
}
const vol = $('vol'); vol.value = state.vol; paint(vol);
vol.addEventListener('input', () => { state.vol = +vol.value; paint(vol); send([[0, masterOf(state.vol)]]); save(); });

const presetBox = $('presets');
for (const p of PRESETS) {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.name = p.name;
  b.innerHTML = `<span>${p.icon}</span>${p.name}`;
  b.onclick = () => applyPreset(p);
  presetBox.appendChild(b);
}
function applyPreset(p) {
  state.preset = p.name; state.v = { ...BASE, ...p.v };
  for (const c of CONTROLS) { inputs[c.key].inp.value = state.v[c.key]; inputs[c.key].upd(); }
  send(engineParams().slice(1)); renderPreset(); save();
}
function renderPreset() {
  for (const b of presetBox.children) b.classList.toggle('on', b.dataset.name === state.preset);
  $('pname').textContent = state.preset || '사용자 설정';
  const v = state.v, m = [];
  const layers = [['White',v.white],['Pink',v.pink],['Brown',v.brown],['Deep',v.deep],['Rain',v.rain]].filter(x=>x[1]>.02);
  m.push(layers.length ? layers.map(x=>x[0]).join(' + ') : '무음');
  if (v.deep > .02) m.push('서브 ' + Math.round(logMap(25,120)(v.subf)) + ' Hz');
  if (v.swell > .05) m.push('파도 스웰');
  $('meta').innerHTML = m.map(s => `<span>${s}</span>`).join('');
}
renderPreset();

// ── 오디오 ─────────────────────────────────────────────────
function b64ToBytes(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }

async function boot() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:'playback' });
  const src = $('worklet-src').textContent;
  const url = URL.createObjectURL(new Blob([src], { type:'application/javascript' }));
  try { await ctx.audioWorklet.addModule(url); }
  catch { await ctx.audioWorklet.addModule("data:application/javascript;base64," + btoa(unescape(encodeURIComponent(src)))); }
  node = new AudioWorkletNode(ctx, 'deep-noise', {
    numberOfInputs:0, numberOfOutputs:1, outputChannelCount:[2],
    processorOptions:{ bytes:b64ToBytes(WASM_B64), params:engineParams() },
  });
  out = ctx.createGain(); out.gain.value = 0;
  analyser = ctx.createAnalyser(); analyser.fftSize = 8192; analyser.smoothingTimeConstant = .82;
  node.connect(out); out.connect(analyser); analyser.connect(ctx.destination);
  $('sr').textContent = (ctx.sampleRate/1000).toFixed(1) + ' kHz';
}

async function toggle() {
  try {
    if (!ctx) await boot();
    if (!playing) {
      await ctx.resume();
      out.gain.cancelScheduledValues(ctx.currentTime);
      out.gain.setTargetAtTime(1, ctx.currentTime, 0.4);
      playing = true;
    } else {
      out.gain.cancelScheduledValues(ctx.currentTime);
      out.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
      playing = false;
      setTimeout(() => { if (!playing) ctx.suspend(); }, 900);
    }
    renderPlay();
  } catch (e) {
    const el = $('err'); el.style.display = 'block';
    el.textContent = '오디오 엔진을 시작하지 못했습니다: ' + e.message + ' (최신 Chrome/Edge/Firefox/Safari를 사용해 주세요)';
  }
}
function renderPlay() {
  $('ico').innerHTML = playing
    ? '<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>'
    : '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
  $('play').setAttribute('aria-label', playing ? '정지' : '재생');
  $('now').textContent = playing ? '재생 중' : (ctx ? '일시정지됨' : '재생 버튼을 눌러 시작하세요');
  if (playing && !raf) raf = requestAnimationFrame(draw);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: state.preset || 'Deep Noise', artist:'Deep Noise' });
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }
}
$('play').onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !(e.target instanceof HTMLInputElement && e.target.type !== 'range')) { e.preventDefault(); toggle(); }
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!playing) toggle(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (playing) toggle(); });
}

// ── 스펙트럼 시각화 ────────────────────────────────────────
const cv = $('viz'), g = cv.getContext('2d');
let fbuf, tbuf, smooth = null;
function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W*dpr || cv.height !== H*dpr) { cv.width = W*dpr; cv.height = H*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const fMin = 20, fMax = 20000, xOf = f => Math.log(f/fMin)/Math.log(fMax/fMin)*W;

  // 그리드
  g.font = '10px Pretendard, sans-serif'; g.fillStyle = '#4a5370'; g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
  for (const [f, t] of [[30,'30'],[60,'60'],[125,'125'],[250,'250'],[500,'500'],[1000,'1k'],[2000,'2k'],[4000,'4k'],[8000,'8k'],[16000,'16k']]) {
    const x = Math.round(xOf(f)) + .5; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); g.fillText(t, x+3, H-6);
  }
  if (!analyser) { raf = 0; return; }
  const n = analyser.frequencyBinCount;
  if (!fbuf) { fbuf = new Float32Array(n); tbuf = new Float32Array(analyser.fftSize); }
  analyser.getFloatFrequencyData(fbuf);
  const binHz = ctx.sampleRate / analyser.fftSize, cols = Math.max(64, Math.floor(W/3));
  if (!smooth || smooth.length !== cols) smooth = new Float32Array(cols).fill(-120);
  const pts = [];
  for (let i = 0; i < cols; i++) {
    const f0 = fMin*Math.pow(fMax/fMin, i/cols), f1 = fMin*Math.pow(fMax/fMin, (i+1)/cols);
    let a = Math.floor(f0/binHz), b = Math.max(a+1, Math.ceil(f1/binHz)), s = 0, c = 0;
    for (let k = a; k < b && k < n; k++) { s += Math.pow(10, fbuf[k]/10); c++; }
    const db = c ? 10*Math.log10(s/c + 1e-12) : -120;
    smooth[i] += (db - smooth[i]) * .35;
    const y = H - 14 - Math.max(0, Math.min(1, (smooth[i] + 110) / 85)) * (H - 24);
    pts.push([ (i+.5)/cols*W, y ]);
  }
  const grad = g.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#4f6bff'); grad.addColorStop(.35,'#7aa2ff'); grad.addColorStop(.7,'#b48cff'); grad.addColorStop(1,'#ff9ccf');
  g.beginPath(); g.moveTo(0,H);
  for (const [x,y] of pts) g.lineTo(x,y);
  g.lineTo(W,H); g.closePath();
  g.globalAlpha = .28; g.fillStyle = grad; g.fill(); g.globalAlpha = 1;
  g.beginPath(); pts.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y));
  g.strokeStyle = grad; g.lineWidth = 2; g.stroke();

  // 재생 버튼 링: 저역 에너지에 반응
  analyser.getFloatTimeDomainData(tbuf);
  let e = 0; for (let i = 0; i < tbuf.length; i++) e += tbuf[i]*tbuf[i];
  const rms = Math.sqrt(e / tbuf.length), ring = $('ring');
  ring.style.opacity = Math.min(.9, rms * 4); ring.style.transform = `scale(${1 + Math.min(.25, rms * 1.2)})`;

  if (playing || out.gain.value > .001) raf = requestAnimationFrame(draw);
  else { raf = 0; ring.style.opacity = 0; }
}
draw();
window.addEventListener('resize', () => { if (!raf) draw(); });

// ── 슬립 타이머 ────────────────────────────────────────────
let timerEnd = 0, timerId = 0;
const timerBox = $('timer');
for (const m of [0, 15, 30, 60, 90]) {
  const b = document.createElement('button'); b.className = 'seg' + (m ? '' : ' on');
  b.textContent = m ? m + '분' : '끄기';
  b.onclick = () => {
    for (const x of timerBox.querySelectorAll('.seg')) x.classList.toggle('on', x === b);
    clearInterval(timerId); timerEnd = m ? Date.now() + m*60000 : 0; $('remain').textContent = '';
    if (m) { if (!playing) toggle(); timerId = setInterval(tick, 1000); tick(); }
  };
  timerBox.appendChild(b);
}
function tick() {
  const left = timerEnd - Date.now();
  if (left <= 0) {
    clearInterval(timerId); $('remain').textContent = '';
    for (const x of timerBox.querySelectorAll('.seg')) x.classList.toggle('on', x.textContent === '끄기');
    if (playing) toggle();
    return;
  }
  // 마지막 60초 동안 서서히 페이드아웃
  if (left < 60000 && playing) out.gain.setTargetAtTime(Math.max(0.0001, left/60000), ctx.currentTime, .5);
  const s = Math.ceil(left/1000);
  $('remain').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 후 종료`;
}
</script>
